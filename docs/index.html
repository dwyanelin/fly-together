<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlyTogether 航班追蹤設定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #f4f6f5;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px env(safe-area-inset-bottom, 12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .card-header h2 {
      font-size: 13.5px;
      font-weight: 700;
      color: #08918D;
      white-space: nowrap;
    }
    .badge {
      font-size: 11px;
      color: #6b7280;
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .slots { display: flex; flex-direction: column; gap: 6px; }
    .slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 8px 7px 10px;
      border-radius: 10px;
      background: #EDF9F8;
      min-height: 36px;
    }
    .slot.empty {
      background: #f5f5f5;
      color: #a3a3a3;
      font-size: 12.5px;
      justify-content: center;
    }
    .slot-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
    }
    .slot-route {
      font-size: 13px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.2px;
    }
    .slot-date {
      font-size: 12px;
      color: #555;
      font-variant-numeric: tabular-nums;
    }
    .slot-price {
      font-size: 12.5px;
      font-weight: 700;
      color: #08918D;
      font-variant-numeric: tabular-nums;
    }
    .delete-btn {
      width: 26px;
      height: 26px;
      min-width: 26px;
      padding: 0;
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #9ca3af;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .delete-btn:hover, .delete-btn:active {
      background: rgba(211, 51, 51, 0.12);
      color: #d33;
    }
    .delete-btn:disabled {
      opacity: 0.35;
      cursor: default;
      background: transparent;
      color: #9ca3af;
    }
    .field-group { margin-top: 10px; }
    .field-group:first-of-type { margin-top: 2px; }
    .airport-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr);
      align-items: end;
      gap: 4px;
    }
    .airport-arrow {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 15px;
      font-weight: 600;
      user-select: none;
    }
    .date-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      font-size: 14px;
      color: #111;
      border: 1px solid #dcdfe3;
      border-radius: 10px;
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus, input:focus {
      border-color: #0ABAB5;
      box-shadow: 0 0 0 2px rgba(10, 186, 181, 0.18);
    }
    .price-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .price-prefix {
      position: absolute;
      left: 11px;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      pointer-events: none;
    }
    .price-wrap input {
      padding-left: 44px;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    #submit {
      width: 100%;
      height: 46px;
      margin-top: 14px;
      font-size: 15.5px;
      font-weight: 700;
      color: #fff;
      background: #0ABAB5;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      transition: background .15s, transform .08s;
    }
    #submit:active { transform: scale(0.99); background: #08918D; }
    #submit:disabled { background: #8EDBD8; cursor: default; transform: none; }
    #message {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      min-height: 18px;
      line-height: 18px;
    }
    #message.ok { color: #08918D; }
    #message.error { color: #d33; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>追蹤中路線</h2>
      <span id="slotBadge" class="badge">0/2・滿格覆蓋最舊</span>
    </div>
    <div id="slots" class="slots"><div class="slot empty">載入中…</div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>新增 / 更新路線</h2>
    </div>

    <div class="field-group airport-row">
      <div>
        <label for="departure">出發機場</label>
        <select id="departure">
          <option value="TPE">TPE 桃園</option>
          <option value="TSA">TSA 松山</option>
        </select>
      </div>
      <div class="airport-arrow" aria-hidden="true">→</div>
      <div>
        <label for="arrival">抵達機場</label>
        <select id="arrival">
          <option value="NRT">NRT 東京成田</option>
          <option value="HND">HND 東京羽田</option>
          <option value="KIX">KIX 大阪關西</option>
          <option value="NGO">NGO 名古屋中部</option>
          <option value="FUK">FUK 福岡</option>
          <option value="CTS">CTS 札幌新千歲</option>
          <option value="OKA">OKA 沖繩那霸</option>
          <option value="ICN">ICN 首爾仁川</option>
          <option value="GMP">GMP 首爾金浦</option>
          <option value="PUS">PUS 釜山</option>
          <option value="HKG">HKG 香港</option>
          <option value="MFM">MFM 澳門</option>
          <option value="BKK">BKK 曼谷蘇凡納布</option>
          <option value="DMK">DMK 曼谷廊曼</option>
          <option value="SIN">SIN 新加坡</option>
          <option value="KUL">KUL 吉隆坡</option>
          <option value="DPS">DPS 峇里島</option>
          <option value="MNL">MNL 馬尼拉</option>
          <option value="CEB">CEB 宿霧</option>
          <option value="SGN">SGN 胡志明市</option>
          <option value="HAN">HAN 河內</option>
          <option value="DAD">DAD 峴港</option>
          <option value="PVG">PVG 上海浦東</option>
        </select>
      </div>
    </div>

    <div class="field-group date-row">
      <div>
        <label for="outboundDate">出發日期</label>
        <input id="outboundDate" type="date">
      </div>
      <div>
        <label for="returnDate">回程日期</label>
        <input id="returnDate" type="date">
      </div>
    </div>

    <div class="field-group">
      <label for="maxPrice">價格門檻（來回含稅低於此價才通知）</label>
      <div class="price-wrap">
        <span class="price-prefix">NT$</span>
        <input id="maxPrice" type="number" inputmode="numeric" min="1" step="1" placeholder="例如 13000">
      </div>
    </div>

    <button id="submit" onclick="submitForm()">儲存設定</button>
    <p id="message"></p>
  </div>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbwgXwKybQ2GJ_z8vfClzqc7EyPpzSMkqJuW1HbzJmIpULWBp5Ol5jxTNCjAQhqipBk-/exec';
    var currentRoutes = [];

    function formatDateRange(outStr, retStr) {
      var o = String(outStr || '').split('-');
      var r = String(retStr || '').split('-');
      if (o.length === 3 && r.length === 3) {
        if (o[0] === r[0]) {
          return o[0] + '/' + o[1] + '/' + o[2] + '–' + r[1] + '/' + r[2];
        }
        return o[0].slice(2) + '/' + o[1] + '/' + o[2] + '–' + r[0].slice(2) + '/' + r[1] + '/' + r[2];
      }
      return outStr + '–' + retStr;
    }

    function renderSlots(routes) {
      currentRoutes = Array.isArray(routes) ? routes : [];
      document.getElementById('slotBadge').textContent =
        currentRoutes.length + '/2・滿格覆蓋最舊';

      var el = document.getElementById('slots');
      var html = '';
      for (var i = 0; i < 2; i++) {
        var r = currentRoutes[i];
        html += r
          ? '<div class="slot">' +
              '<div class="slot-main">' +
                '<span class="slot-route">' + r.departure_id + '→' + r.arrival_id + '</span>' +
                '<span class="slot-date">' + formatDateRange(r.outboundDate, r.returnDate) + '</span>' +
                '<span class="slot-price">&lt;$' + Number(r.maxPrice).toLocaleString() + '</span>' +
              '</div>' +
              '<button type="button" class="delete-btn" onclick="deleteSlot(' + i + ')" aria-label="刪除此路線" title="刪除此路線">&times;</button>' +
            '</div>'
          : '<div class="slot empty">空位（可新增）</div>';
      }
      el.innerHTML = html;
    }

    function setDeleteButtonsDisabled(disabled) {
      var btns = document.querySelectorAll('.delete-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].disabled = disabled;
      }
    }

    function showMessage(text, isError) {
      var el = document.getElementById('message');
      el.textContent = text;
      el.className = isError ? 'error' : 'ok';
    }

    async function apiPost(payload) {
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return res.json();
    }

    async function loadRoutes() {
      try {
        var res = await fetch(API_URL + '?action=list', { redirect: 'follow' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var json = await res.json();
        renderSlots(json.routes || []);
      } catch (err) {
        renderSlots([]);
        showMessage('載入失敗，請重新整理頁面', true);
      }
    }

    async function deleteSlot(index) {
      var target = currentRoutes[index];
      if (!target) return;

      setDeleteButtonsDisabled(true);
      showMessage('刪除中…', false);

      try {
        var res = await apiPost({ action: 'delete', target: target });
        showMessage(res.message, !res.ok);
        renderSlots(res.routes);
      } catch (err) {
        setDeleteButtonsDisabled(false);
        showMessage('刪除失敗：' + err.message, true);
      }
    }

    async function submitForm() {
      var data = {
        departure_id: document.getElementById('departure').value,
        arrival_id: document.getElementById('arrival').value.trim().toUpperCase(),
        outboundDate: document.getElementById('outboundDate').value,
        returnDate: document.getElementById('returnDate').value,
        maxPrice: document.getElementById('maxPrice').value
      };

      var btn = document.getElementById('submit');
      btn.disabled = true;
      showMessage('儲存中…', false);

      try {
        var res = await apiPost({ action: 'submit', data: data });
        btn.disabled = false;
        showMessage(res.message, !res.ok);
        if (res.ok) renderSlots(res.routes);
      } catch (err) {
        btn.disabled = false;
        showMessage('儲存失敗：' + err.message, true);
      }
    }

    loadRoutes();

    var today = new Date().toISOString().slice(0, 10);
    var outEl = document.getElementById('outboundDate');
    var retEl = document.getElementById('returnDate');
    outEl.min = today;
    retEl.min = today;
    outEl.addEventListener('change', function () {
      retEl.min = outEl.value || today;
      if (retEl.value && outEl.value && retEl.value <= outEl.value) {
        retEl.value = '';
      }
    });
  </script>
</body>
</html>
