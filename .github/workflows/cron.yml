name: Flight Price Monitor

on:
  # Triggered 4 times/day (08:00, 12:00, 17:00, 22:00 Asia/Taipei) by Google Apps Script
  # (apps-script/Code.gs -> triggerFlightMonitor) via workflow_dispatch to avoid GitHub's
  # 60-day inactivity rule that disables `on: schedule` workflows on public repos.
  # Quota: 2 routes × 4 runs/day × 31 days = 248 SerpApi calls/month (free tier: 250)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Run flight tracker
        run: node dist/main.js
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ROUTES_API_URL: ${{ secrets.ROUTES_API_URL }}
